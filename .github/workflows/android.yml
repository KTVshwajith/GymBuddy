name: Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  apk:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - run: npm ci
      - run: npm run build

      - name: Create Android project
        run: |
          npx cap add android
          # camera access for live form checking
          sed -i 's#<uses-permission android:name="android.permission.INTERNET" />#<uses-permission android:name="android.permission.INTERNET" />\n    <uses-permission android:name="android.permission.CAMERA" />\n    <uses-feature android:name="android.hardware.camera" android:required="false" />#' android/app/src/main/AndroidManifest.xml
          grep -n "permission" android/app/src/main/AndroidManifest.xml
          npx cap sync android

      - name: Build debug APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Rename APK
        run: cp android/app/build/outputs/apk/debug/app-debug.apk GymBuddy.apk

      - uses: actions/upload-artifact@v4
        with:
          name: GymBuddy-apk
          path: GymBuddy.apk

      - name: Publish to the "latest" release (easy phone download)
        uses: softprops/action-gh-release@v2
        with:
          tag_name: latest
          name: GymBuddy – latest build
          body: |
            Debug build from commit ${{ github.sha }}.
            On your Android phone: tap GymBuddy.apk below, open it, and allow "Install unknown apps" when asked.
          prerelease: true
          make_latest: true
          files: GymBuddy.apk
